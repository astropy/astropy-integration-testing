name: integration-matrix

# Calls the reusable workflow from OpenAstronomy/integration-dashboard,
# which reads `columns:` from packages.yaml to build the matrix, runs
# every column, and publishes the dashboard to gh-pages (or, on pull
# requests, uploads it as a preview artifact for preview-link.yml).
# The name above must stay in sync with `workflows:` in preview-link.yml.

on:
  schedule:
    - cron: '0 6 * * 0'   # Sundays at 06:00 UTC
  workflow_dispatch:
  pull_request:

permissions: {}

jobs:
  integration:
    permissions:
      contents: write     # to publish the dashboard to gh-pages
    uses: OpenAstronomy/integration-dashboard/.github/workflows/integration.yml@main
    with:
      config: packages.yaml
